<!doctype html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>DiagAuto | Sistema Experto de Diagnóstico Automotriz</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="app-shell">
    <aside class="sidebar">
      <div class="brand">
        <div class="brand-icon">🔧</div>
        <div>
          <h1>Administrador</h1>
          <span>Taller Mecánico</span>
        </div>
      </div>

      <nav class="menu">
        <button class="menu-item active" data-section="diagnostico">Análisis de Fallas</button>
        <button class="menu-item" data-section="base-conocimiento">Fallas Comunes</button>
      </nav>
    </aside>

    <main class="main-content">
      <header class="topbar">
        <div>
          <p class="topbar-label">Bienvenido de nuevo</p>
          <h1>Sistema Car Care</h1>
        </div>
        <div class="topbar-actions">
          <p id="topbarDate"></p>
          <div class="profile-badge">AN</div>
        </div>
      </header>

      <section class="page-intro">
        <div>
          <h2 id="section-title">Análisis de Fallas</h2>
          <p class="section-subtitle">Sigue los pasos para diagnosticar el vehículo.</p>
        </div>
        <div class="search-box">
          <input id="searchInput" type="search" placeholder="Buscar por falla, categoría o síntoma..." />
          <button id="searchButton" type="button" aria-label="Buscar">
            🔎
          </button>
        </div>
      </section>

      <section id="content-area" class="content-area"></section>
    </main>
  </div>

  <script src="script.js"></script>
</body>
</html>
